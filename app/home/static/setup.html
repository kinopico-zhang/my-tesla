<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 首启引导页: 三步 (管理员/TeslaMate/高德 Key) 配齐之前是唯一入口,
     不允许跳过 —— 应用页的门 (/tesla) 会把人送回来; 中途退出下次从缺口
     步接着走 (起步步数由 setup.js 查 /api/setup-status 决定)。页面本身
     免登录, 建管理员即种会话 cookie -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/static/manifest.json">
  <title>初始化 · My Tesla</title>
<link rel="stylesheet" href="/static/css/setup-page.css?v=2">
</head>
<body data-done="/tesla">
<div class="card" id="card">
  <div class="icon">⚡</div>
  <h1>My Tesla</h1>
  <div class="sub">首次使用 · 三步配齐才能进入</div>
  <ol class="steps" id="steps">
    <li>管理员</li><li>数据源</li><li>地图</li>
  </ol>
  <form id="form1" hidden autocomplete="on">
    <div class="field">
      <label for="su-name">名称</label>
      <input id="su-name" name="name" type="text" autocapitalize="off"
             autocorrect="off" autocomplete="nickname" maxlength="20"
             placeholder="2~20 个字符" required>
    </div>
    <div class="field">
      <label for="su-pass">密码</label>
      <input id="su-pass" name="new-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
      <button type="button" class="eye-btn" id="eye" aria-label="显示密码">
        <svg id="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <svg id="eye-slash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
    </div>
    <div class="field">
      <label for="su-pass2">确认</label>
      <input id="su-pass2" name="confirm-password" type="password"
             autocomplete="new-password" minlength="6" maxlength="64" required>
    </div>
    <button class="btn" type="submit">建立管理员</button>
    <div class="err"></div>
  </form>
  <form id="form2" hidden>
    <p class="hint">TeslaMate 行车数据库的连接参数; 保存时自动验证, 连不上
    会原样退回可重试。</p>
    <div class="field">
      <label for="tm-host">地址</label>
      <input id="tm-host" type="text" autocapitalize="off" autocorrect="off"
             placeholder="TeslaMate PostgreSQL 主机" required>
    </div>
    <div class="field">
      <label for="tm-port">端口</label>
      <input id="tm-port" type="text" inputmode="numeric" placeholder="5432">
    </div>
    <div class="field">
      <label for="tm-user">用户</label>
      <input id="tm-user" type="text" autocapitalize="off" autocorrect="off"
             placeholder="teslamate">
    </div>
    <div class="field">
      <label for="tm-pass">密码</label>
      <input id="tm-pass" type="password" placeholder="未设置">
    </div>
    <div class="field">
      <label for="tm-name">库名</label>
      <input id="tm-name" type="text" autocapitalize="off" autocorrect="off"
             placeholder="teslamate">
    </div>
    <button class="btn" type="submit">保存并连接</button>
    <div class="err"></div>
  </form>
  <form id="form3" hidden>
    <p class="hint">高德开放平台的应用 Key 与安全码 (地图显示用); 足迹道路
    拟合的 Web 服务 Key 在 设置 → 地图设置 里另配。</p>
    <div class="field">
      <label for="amap-key">Key</label>
      <input id="amap-key" type="text" autocapitalize="off" autocorrect="off"
             placeholder="未设置" required>
    </div>
    <div class="field">
      <label for="amap-code">安全码</label>
      <input id="amap-code" type="text" autocapitalize="off" autocorrect="off"
             placeholder="未设置">
    </div>
    <button class="btn" type="submit">保存</button>
    <div class="err"></div>
  </form>
  <div class="done" id="done" hidden>
    <div class="done-icon">✅</div>
    <p>初始化完成, 正在进入…</p>
  </div>
</div>
<script src="/static/setup.js?v=2"></script>
</body>
</html>
