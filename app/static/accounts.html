<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/static/manifest.json">
  <title>账号管理 · My Tesla</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --surface-3: #3a3a3c;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button, a, summary { touch-action: manipulation; }

/* ---------- 顶部导航 (毛玻璃, 与其他页一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 8px; }
.nav-row > * { flex-shrink: 0; }
#refresh-btn {
  align-self: center; display: flex; align-items: center; margin-left: auto;
  color: var(--ink-1); background: var(--surface-2);
  padding: 5px 9px; border-radius: 999px;
}
#refresh-btn:active { background: var(--surface-3); }
#refresh-btn.busy svg { animation: refresh-spin .8s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }
.nav-menu { position: relative; align-self: center; margin-left: auto; }
.nav-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--ink-1); background: var(--surface-2);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  list-style: none; -webkit-user-select: none; user-select: none;
}
.nav-menu summary::-webkit-details-marker { display: none; }
.nav-menu summary:active { opacity: .7; }
.nav-menu[open] summary { background: var(--surface-3); }
.nav-menu .chev { transition: transform .18s; }
.nav-menu[open] .chev { transform: rotate(180deg); }
.nav-menu .menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 128px; z-index: 30;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.nav-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-decoration: none;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu a:active { background: var(--surface-3); }
.nav-menu .menu a.on { color: #7db3f0; }
.brand-menu { margin-left: 0; }
.brand-menu summary {
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  background: none; padding: 0; border-radius: 0;
}
.brand-menu[open] summary { background: none; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu { left: 0; right: auto; }
.nav-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
}
.nav-menu .menu button {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
@media (max-width: 479px) {
  header { position: relative; }
  .nav-menu { position: static; }
  .nav-menu .menu { left: 12px; right: 12px; }
}

/* ---------- 卡片 ---------- */
main {
  flex: 1; width: 100%; max-width: 560px; margin: 0 auto;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 32px);
  display: flex; flex-direction: column; gap: 16px;
}
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 16px; padding: 16px;
}
.card h2 { font-size: 16px; font-weight: 650; letter-spacing: -.2px; }
.hint { font-size: 12px; color: var(--ink-3); margin: 4px 0 14px; }
.hint b { color: var(--ink-2); font-weight: 500; }

/* 邀请有效期档位 (充电地点筛选同款胶囊) */
.days-row { display: flex; gap: 8px; margin-bottom: 12px; }
.days-row button {
  flex: 1; padding: 9px 0; border-radius: 999px; font-size: 13.5px;
  border: 1px solid var(--hairline); background: var(--surface-2); color: var(--ink-2);
}
.days-row button.on {
  color: #7db3f0; border-color: rgba(57,135,229,.5);
  background: rgba(57,135,229,.12);
}
.primary {
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
  padding: 10px 18px; border-radius: 999px; margin-top: 4px;
}
.primary:active { transform: scale(.97); }
.primary:disabled { opacity: .4; }

/* ---------- 用户列表 ---------- */
.usr-row {
  display: flex; align-items: center; gap: 8px;
  padding: 11px 0; border-bottom: 1px solid var(--hairline);
}
.usr-row:last-child { border-bottom: 0; }
/* 徽章必须是 .usr-row 的 flex 子元素, 不能塞在 .usr-name 里:
   那里有 overflow:hidden (长名省略号), inline 元素的上下 padding 不撑行盒,
   徽章下半截 (含下边框) 会伸出行盒被裁掉 (2026-09-13 用户抓到) */
.usr-name { flex: 1; min-width: 0; font-size: 15px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.usr-badge {
  flex: none; font-size: 10.5px; line-height: 1; color: #7db3f0;
  border: 1px solid rgba(57,135,229,.4);
  border-radius: 999px; padding: 3px 8px;
}
.usr-meta { flex: none; font-size: 12px; color: var(--ink-3); }

/* ---------- 邀请列表 ---------- */
.inv-card {
  border: 1px solid var(--hairline); border-radius: 12px;
  padding: 11px 12px; margin-bottom: 10px; background: var(--surface-2);
}
.inv-card:last-child { margin-bottom: 0; }
.inv-top { display: flex; align-items: center; gap: 8px; }
.inv-date { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); }
.inv-state { flex: none; font-size: 11px; border-radius: 999px; padding: 2px 9px; }
.inv-state.ok { color: #5fd47f; background: rgba(48,209,88,.12); }
.inv-state.used { color: var(--ink-3); background: rgba(235,235,245,.08); }
.inv-state.expired { color: var(--ink-3); background: rgba(235,235,245,.08); }
.inv-state.revoked { color: #e5695f; background: rgba(229,105,95,.12); }
.inv-acts { display: flex; gap: 8px; margin-top: 9px; }
.inv-acts button {
  font-size: 12.5px; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--hairline); color: var(--ink-2);
}
.inv-acts .copy { color: #7db3f0; border-color: rgba(57,135,229,.35); }
.inv-acts .revoke { color: #e5695f; }
.inv-acts button:active { background: var(--surface-3); }
.inv-acts button:disabled { opacity: .35; }
.inv-empty { padding: 12px 0 4px; font-size: 13px; color: var(--ink-3); text-align: center; }

/* 非管理员提示 */
.denied { text-align: center; color: var(--ink-2); font-size: 14px; padding: 40px 10px; }

/* ---------- 轻提示 ---------- */
#toast {
  position: fixed; top: calc(env(safe-area-inset-top) + 60px); left: 50%;
  transform: translateX(-50%) translateY(-8px); z-index: 99;
  max-width: 80vw; font-size: 13px; color: #fff; text-align: center;
  background: rgba(10,10,12,.85);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-radius: 999px; padding: 9px 16px;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err { color: #ffb3ad; }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Tesla<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">My Tesla</a>
        <a class="on" href="/accounts">账号管理</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="refresh-btn" aria-label="刷新账号"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<main>
  <div class="denied" id="denied" hidden>账号管理需要管理员权限</div>

  <section class="card" id="users-card" hidden>
    <h2>账号</h2>
    <p class="hint">家里每个人都用自己的账号登录, 数据按账号标注。邀请注册的账号拥有除账号管理外的全部功能。</p>
    <div id="user-list"></div>
  </section>

  <section class="card" id="invite-card" hidden>
    <h2>发注册邀请</h2>
    <p class="hint">生成一次性邀请链接发给家人; 注册后自动登录, 无需再发密码。</p>
    <div class="days-row" id="days-row">
      <button data-days="1" class="on">1 天</button>
      <button data-days="7">7 天</button>
      <button data-days="30">30 天</button>
    </div>
    <button class="primary" id="invite-make">生成邀请链接</button>
  </section>

  <section class="card" id="list-card" hidden>
    <h2>邀请记录</h2>
    <p class="hint">一次性链接: 注册过 / 过期 / 撤销后都不能再用。</p>
    <div id="invite-list"></div>
    <div class="inv-empty" id="invite-empty" hidden>还没有发过邀请</div>
  </section>
</main>

<div id="toast" hidden></div>

<script src="/static/menu-user.js?v=1"></script>
<script src="/static/accounts.js?v=1"></script>
</body>
</html>
