<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/tesla/static/manifest.json">
<script src="/static/menu-user.js?v=2"></script>
<script src="/tesla/static/js/lastpage.js?v=1"></script>
<title>更新日志 · My Tesla</title>
<link rel="stylesheet" href="/tesla/static/css/tesla-changelog.css?v=1">
</head>
<body data-changelog-api="/tesla/changelog/api/entries">

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Tesla<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">充电记录</a>
        <a href="/tesla/stats">充电统计</a>
        <a href="/tesla/chargemap">充电地图</a>
        <a href="/tesla/map">足迹地图</a>
        <a href="/tesla/trips">行程列表</a>
        <a href="/tesla/groups">行程分组</a>
        <a href="/tesla/live">当前驾驶</a>
        <a href="/tesla/settings">软件设置</a>
        <a class="on" href="/tesla/changelog">更新日志</a>
        <button type="button" class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button type="button" id="refresh-btn" aria-label="刷新日志"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<main>
    <div id="entries">
    <div id="list"></div>
    <div class="state" id="loading"><div class="spin"></div>正在读取版本历史…</div>
    <div class="state" id="error" hidden>
      <div id="error-text">加载失败</div>
      <button type="button" class="retry-btn" id="retry">重试</button>
    </div>
  </div>
</main>

<script src="/static/changelog-page.js?v=1"></script>
</body>
</html>
