<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/tesla/static/manifest.json">
<script src="/static/menu-user.js?v=2"></script>
<script src="/tesla/static/js/lastpage.js?v=1"></script>
  <title>行程列表 · My Tesla</title>
<link rel="stylesheet" href="/tesla/static/css/tesla-trips-page.css?v=1">
<link rel="stylesheet" href="/tesla/static/css/tesla-trips-cards.css?v=1">
<link rel="stylesheet" href="/tesla/static/css/tesla-trips-sheet.css?v=1">
<link rel="stylesheet" href="/tesla/static/css/tesla-trips-playback.css?v=1">
</head>
<body>

<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Tesla<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">充电记录</a>
        <a href="/tesla/stats">充电统计</a>
        <a href="/tesla/chargemap">充电地图</a>
        <a href="/tesla/map">足迹地图</a>
        <a class="on" href="/tesla/trips">行程列表</a>
        <a href="/tesla/groups">行程分组</a>
        <a href="/tesla/live">当前驾驶</a>
        <a href="/tesla/settings">软件设置</a>
        <a href="/tesla/changelog">更新日志</a>
        <button type="button" class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <details class="nav-menu time-menu" id="time-menu">
      <summary><span id="time-lb">全部</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu" id="time-opts">
        <button type="button" data-v="24h">最近 24 小时</button>
        <button type="button" data-v="7d">最近一周</button>
        <button type="button" data-v="30d">最近一个月</button>
        <button type="button" data-v="180d">最近半年</button>
        <button type="button" data-v="1y">最近一年</button>
        <button type="button" data-v="all" class="on">全部</button>
        <div class="tm-custom">
          <button type="button" data-v="custom">自定义…</button>
          <div class="tm-dates" id="tm-dates" hidden>
            <div class="tm-cal-top">
              <button type="button" id="tm-prev" aria-label="上个月">‹</button>
              <b id="tm-ym"></b>
              <button type="button" id="tm-next" aria-label="下个月">›</button>
            </div>
            <div class="tm-week"><i>一</i><i>二</i><i>三</i><i>四</i><i>五</i><i>六</i><i>日</i></div>
            <div class="tm-cal" id="tm-cal"></div>
            <div class="tm-foot"><span id="tm-sel"></span><button type="button" id="tm-apply">确定</button></div>
          </div>
        </div>
      </div>
    </details>
    <button type="button" id="refresh-btn" aria-label="刷新列表"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <!-- 行程页独有筛选 (顶栏时间筛选之下): 起点城市 / 终点城市 / 里程范围 -->
  <div class="filters">
    <details class="nav-menu filt" id="fc-menu">
      <summary><span class="fl" id="fc-lb">起点: 全部</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu loc-menu" id="fc-opts"></div>
    </details>
    <details class="nav-menu filt" id="tc-menu">
      <summary><span class="fl" id="tc-lb">终点: 全部</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu loc-menu" id="tc-opts"></div>
    </details>
    <details class="nav-menu filt" id="km-menu">
      <summary><span class="fl" id="km-lb">里程: 全部</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu" id="km-opts">
        <button type="button" data-k="all" class="on">全部</button>
        <button type="button" data-k="0-20">20km 内</button>
        <button type="button" data-k="20-100">20–100km</button>
        <button type="button" data-k="100-300">100–300km</button>
        <button type="button" data-k="300+">300km 以上</button>
      </div>
    </details>
    <details class="nav-menu filt" id="drv-menu" hidden>
      <summary><span class="fl" id="drv-lb">驾驶员: 全部</span><svg class="chev" viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu" id="drv-opts"><button type="button" data-id="" class="on">全部</button></div>
    </details>
  </div>
</header>

<main>
  <div class="sec-head">
    <h2>行程轨迹</h2>
    <span class="count-badge" id="count-badge"></span>
  </div>
  <div id="list"></div>

  <div class="tail" id="tail" hidden>
    <div class="spin" id="loader-spin" hidden></div>
    <div class="endnote" id="endnote" hidden>· 已经到底啦 ·</div>
    <div class="empty" id="empty" hidden>还没有行程记录</div>
    <div class="err-box" id="errbox" hidden>
      <p id="errmsg">加载失败</p>
      <button type="button" class="retry" id="retry">重试</button>
    </div>
  </div>
</main>

<div class="selbar" id="selbar" hidden>
  <div class="sel-row">
    <div class="sel-info">已选 <b id="sel-count">0</b> 段 · <span id="sel-km">0</span> km<span id="sel-cap" hidden> · 一次最多 100 段</span></div>
    <button type="button" class="sel-all" id="gp-btn" disabled>存为分组</button>
    <button type="button" class="sel-all" id="sel-all">全选</button>
    <button type="button" class="sel-cancel" id="sel-cancel">取消</button>
    <button type="button" class="sel-go" id="sel-go" disabled>查看连续轨迹</button>
  </div>
  <div class="gp-row">
    <input type="text" id="gp-name" maxlength="30" placeholder="分组名字" autocomplete="off">
    <button type="button" class="sel-go" id="gp-save">保存</button>
    <button type="button" class="sel-cancel" id="gp-name-cancel">取消</button>
  </div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="sh-head">
    <div class="sh-title" id="sh-date">–</div>
    <div class="sh-sub" id="sh-time"></div>
  </div>
  <div class="sh-drv" id="sh-drv" hidden>
    <span id="sh-drv-pick" hidden><span class="lb">驾驶员</span><select id="sh-drv-sel"></select></span>
    <span class="sh-toll" id="sh-toll" hidden></span>
  </div>
  <div class="sh-cells">
    <div class="sh-cell"><div class="lb">里程</div><div class="val" id="sh-km">–</div></div>
    <div class="sh-cell"><div class="lb">时长</div><div class="val" id="sh-dur">–</div></div>
    <div class="sh-cell"><div class="lb" id="sh-spd-lb">最高车速</div><div class="val" id="sh-spd">–</div></div>
    <div class="sh-cell" id="sh-cell-pw" hidden><div class="lb" id="sh-pw-lb">平均功耗</div><div class="val" id="sh-pw">–</div></div>
    <div class="sh-cell" id="sh-cell-kwh" hidden><div class="lb">总电耗</div><div class="val" id="sh-kwh">–</div></div>
    <div class="sh-cell" id="sh-cell-avg" hidden><div class="lb">平均电耗</div><div class="val" id="sh-avg">–</div></div>
  </div>
  <div class="playbar" id="playbar" hidden>
    <button type="button" id="pb-toggle" class="pb-btn" aria-label="暂停"></button>
    <input type="range" id="pb-seek" class="pb-seek" min="0" max="1000" step="1" value="0">
    <button type="button" id="pb-speed" class="pb-speed">1×</button>
    <div class="pb-zoom" title="视角基线: 随速变焦整体拉近/拉远 (慢近快远不变)">
      <button type="button" id="pb-zout" class="pb-zb" aria-label="视角拉远">−</button>
      <span id="pb-zval">0</span>
      <button type="button" id="pb-zin" class="pb-zb" aria-label="视角拉近">+</button>
    </div>
    <button type="button" id="pb-rec" class="pb-btn" aria-label="导出视频"><span class="rec-dot"></span></button>
  </div>
  <div class="trip-map-wrap">
    <div id="trip-map"></div>
    <div class="trip-msg" id="trip-msg">
      <div class="spin" id="trip-spin" hidden></div>
      <div id="trip-msg-text">正在加载轨迹…</div>
    </div>
  </div>
</div>

<div class="rec-modal" id="rec-modal" hidden>
  <div class="rec-card">
    <video id="rec-video" playsinline controls></video>
    <div class="rec-acts">
      <button type="button" id="rec-save" class="rec-main">存到相册</button>
      <button type="button" id="rec-close">关闭</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<script src="/tesla/static/js/gcj02.js?v=1"></script>
<script src="/tesla/static/js/trackutil.js?v=1"></script>
<script src="/tesla/static/js/format.js?v=1"></script>
<script src="/tesla/static/js/track-animation.js?v=1"></script>
<script src="/tesla/static/js/trip-playback.js?v=1"></script>
<script src="/tesla/static/js/trips-list-page.js?v=1"></script>
<script src="/tesla/static/js/trips-list-url.js?v=1"></script>
<script src="/tesla/static/js/trips-list-time-filters.js?v=1"></script>
<script src="/tesla/static/js/trips-list-region-filters.js?v=1"></script>
<script src="/tesla/static/js/trips-list-select.js?v=1"></script>
<script src="/tesla/static/js/trips-list-groups.js?v=1"></script>
<script src="/tesla/static/js/trips-sheet-page.js?v=1"></script>
<script src="/tesla/static/js/trips-playback-bar.js?v=1"></script>
<script src="/tesla/static/js/trips-gap-routing.js?v=1"></script>
<script src="/tesla/static/js/trips-playback-zoom.js?v=1"></script>
<script src="/tesla/static/js/trips-playback-overlays.js?v=1"></script>
<script src="/tesla/static/js/trips-playback-loop.js?v=1"></script>
<script src="/tesla/static/js/trips-playback-session.js?v=1"></script>
<script src="/tesla/static/js/trips-preload-tiles.js?v=1"></script>
<script src="/tesla/static/js/trips-preload-vector.js?v=1"></script>
<script src="/tesla/static/js/trips-sheet-driver.js?v=1"></script>
<script src="/tesla/static/js/trips-sheet-open.js?v=1"></script>
<script src="/tesla/static/js/trips-export-video.js?v=1"></script>
<script src="/tesla/static/js/trips-sheet-close.js?v=1"></script>
</body>
</html>
