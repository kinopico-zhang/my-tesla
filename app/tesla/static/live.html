<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="32x32" href="/tesla/static/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/tesla/static/favicon.svg">
<link rel="apple-touch-icon" href="/tesla/static/apple-touch-icon.png?v=2">
<link rel="manifest" href="/tesla/static/manifest.json">
<script src="/static/menu-user.js?v=2"></script>
<script src="/tesla/static/lastpage.js?v=1"></script>
<title>当前驾驶 · My Tesla</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --surface: #1c1c1e;
  --surface-2: #2c2c2e;
  --ink-1: #f5f5f7;
  --ink-2: rgba(235,235,245,.62);
  --ink-3: rgba(235,235,245,.32);
  --hairline: rgba(255,255,255,.09);
  --nav-bg: rgba(10,10,12,.72);
  --blue: #3987e5;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink-1);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
               "Helvetica Neue", system-ui, sans-serif;
  font-size: 14px; line-height: 1.45;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
/* 触屏双击控件不再触发整页放大 (manipulation 保留平移/捏合, 只去掉双击缩放) */
button, a, summary { touch-action: manipulation; }

/* ---------- 顶部导航 (毛玻璃, 与其他页一致) ---------- */
header {
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom: 1px solid var(--hairline);
  z-index: 50;
}
.nav-row { display: flex; align-items: baseline; gap: 8px; }
.nav-row > * { flex-shrink: 0; }

/* 顶栏刷新按钮 (与页签胶囊同款样式) */
#refresh-btn {
  align-self: center; display: flex; align-items: center; margin-left: auto;
  color: var(--ink-1); background: var(--surface-2);
  padding: 5px 9px; border-radius: 999px;
}
#refresh-btn:active { background: var(--surface-3); }
#refresh-btn.busy svg { animation: refresh-spin .8s linear infinite; }
@keyframes refresh-spin { to { transform: rotate(360deg); } }
.nav-menu { position: relative; align-self: center; margin-left: auto; }
.nav-menu summary {
  display: flex; align-items: center; gap: 5px;
  font-size: 12px; color: var(--ink-1); background: var(--surface-2);
  padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  list-style: none; -webkit-user-select: none; user-select: none;
}
.nav-menu summary::-webkit-details-marker { display: none; }
.nav-menu summary:active { opacity: .7; }
.nav-menu[open] summary { background: var(--surface-3); }
.nav-menu .chev { transition: transform .18s; }
.nav-menu[open] .chev { transform: rotate(180deg); }
.nav-menu .menu {
  position: absolute; top: calc(100% + 8px); right: 0; min-width: 128px; z-index: 30;
  display: flex; flex-direction: column; padding: 5px;
  background: rgba(44,44,46,.88);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5);
}
.nav-menu .menu a {
  font-size: 14px; color: var(--ink-1); text-decoration: none;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu a:active { background: var(--surface-3); }
.nav-menu .menu a.on { color: #7db3f0; }
.brand-menu { margin-left: 0; }
.brand-menu summary {
  font-size: 20px; font-weight: 700; letter-spacing: -.3px;
  background: none; padding: 0; border-radius: 0;
}
.brand-menu[open] summary { background: none; }
.brand-menu .chev { color: var(--ink-3); }
.brand-menu .menu { left: 0; right: auto; }
.nav-menu .menu .logout-row {
  color: #e5484d; border-top: 1px solid var(--hairline); margin-top: 5px;
}
.brand-menu + .nav-menu { margin-left: auto; }
.nav-menu .menu button {
  font-size: 14px; color: var(--ink-1); text-align: left;
  padding: 9px 12px; border-radius: 10px; white-space: nowrap;
}
.nav-menu .menu button:active { background: var(--surface-3); }
/* 手机: 下拉改顶栏正下方近全宽面板 (同其他页) */
@media (max-width: 479px) {
  header { position: relative; }
  .nav-menu { position: static; }
  .nav-menu .menu { left: 12px; right: 12px; }
}

/* ---------- 主体 ---------- */
main {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: 10px 14px calc(env(safe-area-inset-bottom) + 10px); gap: 10px;
  overflow: hidden;
}

/* 首帧等待 (第一次状态返回前) */
.booting { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; color: var(--ink-2); }
.spin {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid rgba(255,255,255,.18); border-top-color: var(--blue);
  animation: rot .8s linear infinite;
}
@keyframes rot { to { transform: rotate(360deg); } }

/* ---------- 驾驶视图 ---------- */
#live { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }

.hero {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  padding: 14px 18px; display: flex; align-items: center; gap: 16px;
}
.hero-speed { flex: 1; min-width: 0; }
.hero-speed .lb { font-size: 12px; color: var(--ink-2); }
.hero-speed .num {
  font-size: 54px; font-weight: 700; letter-spacing: -2px; line-height: 1.05;
  font-variant-numeric: tabular-nums; margin-top: 2px;
  display: flex; align-items: baseline; white-space: nowrap;
  /* flex 不换行: 窄屏/系统页缩放挤压时单位绝不下坠到第二行 (用户真机踩坑) */
}
.hero-speed .num small { font-size: 15px; font-weight: 500; color: var(--ink-2);
  letter-spacing: 0; margin-left: 4px; }
/* 右列可收缩 (出发行时一行省略号), 不再死宽抢速度区的空间 */
.hero-side { flex-shrink: 1; min-width: 0; text-align: right; display: grid; gap: 4px; }
.hero-side .lb { font-size: 11px; color: var(--ink-2); }
.hero-side .elapsed { font-size: 24px; font-weight: 650; letter-spacing: -.5px;
  font-variant-numeric: tabular-nums; }
.hero-side .sub { font-size: 12px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 实时数字位数变化 (9→62→105 / 59:59→1:00:00 / 9%→100%) 不许推动布局:
   tabular 数字 + 定宽盒 (ch = 一个数字宽), 数字在盒内右对齐, 变长只向左长 */
#lv-speed { display: inline-block; min-width: 3ch; text-align: right; }
#lv-elapsed { min-width: 7ch; }
#lv-soc { display: inline-block; min-width: 5ch; text-align: right; }   /* % 不受 tabular 管, 100% ≈ 4.7ch */
#lv-range { display: inline-block; min-width: 3ch; text-align: right; }
.tile .val .n, #lv-sub .n { display: inline-block; text-align: right; }
#lv-km .n, #lv-kwh .n { min-width: 4.5ch; }
#lv-avg .n, #lv-vmax .n, #lv-sub .n { min-width: 3ch; }

.batt-card {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: 18px;
  padding: 11px 16px; display: flex; align-items: center; gap: 12px;
}
.batt { position: relative; width: 46px; height: 22px; flex: none;
  border: 1.5px solid var(--ink-3); border-radius: 6px; padding: 2px; }
.batt::after {   /* 电池正极凸点 */
  content: ""; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 9px; background: var(--ink-3); border-radius: 0 2px 2px 0;
}
.batt i { display: block; height: 100%; border-radius: 3px; background: #32d74b;
  transition: width .5s, background .5s; }
.batt-card b { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; }
.batt-card .batt-range { font-size: 13px; color: var(--ink-2); }
.batt-card .batt-range b { font-size: 13px; color: var(--ink-1); font-weight: 600; }

.tiles { display: flex; flex-wrap: wrap; gap: 10px; }
.tile {   /* 2×2: 四格一行在窄屏/页缩放下放不下会溢出圆角框 (用户真机踩坑) */
  flex: 1 1 calc(50% - 5px); min-width: 0; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 14px; padding: 9px 8px;
  text-align: center;
}
.tile .lb { font-size: 11px; color: var(--ink-2); white-space: nowrap; }
.tile .val { font-size: 17px; font-weight: 650; letter-spacing: -.3px; margin-top: 2px;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.tile .val small { font-size: 10.5px; font-weight: 500; color: var(--ink-2); margin-left: 2px; }

.map-wrap {
  position: relative; flex: 1; min-height: 0;
  border-radius: 16px; overflow: hidden; border: 1px solid var(--hairline);
  background: var(--surface);
}
#map { position: absolute; inset: 0; touch-action: none; }
#map .amap-copyright { display: none !important; }   /* "©…auto navi" 版权文字按需求去掉 */
.map-fallback {   /* 高德不可用: 统计照常, 只在地图位放提示 */
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 8px;
  color: var(--ink-2); font-size: 13px; padding: 20px; text-align: center;
}
.stale-hint {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 30;
  padding: 6px 14px; border-radius: 999px;
  background: rgba(28,28,30,.85);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--hairline);
  font-size: 12px; color: var(--ink-2); white-space: nowrap;
  pointer-events: none;
}
/* 车辆位置: 蓝点 + 扩散脉冲 (在开的人一眼看到自己在哪) */
.car-dot { position: relative; width: 18px; height: 18px; }
.car-dot::before {
  content: ""; position: absolute; inset: -8px; border-radius: 50%;
  background: rgba(57,135,229,.4); animation: pulse 1.8s ease-out infinite;
}
.car-dot::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: #3987e5; border: 2.5px solid #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.55);
}
@keyframes pulse { 0% { transform: scale(.55); opacity: .9; }
                   100% { transform: scale(2.3); opacity: 0; } }

/* ---------- 空态 / 结束态 ---------- */
.state-view { flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; padding: 24px; text-align: center; }
.state-view .big { font-size: 44px; line-height: 1.2; }
.state-view h2 { font-size: 18px; font-weight: 700; }
.state-view p { font-size: 13px; color: var(--ink-2); max-width: 300px; }
.state-view .cta {
  margin-top: 14px; padding: 10px 28px; border-radius: 999px;
  background: var(--blue); color: #fff; font-size: 14px; font-weight: 600;
  text-decoration: none; display: inline-block;
}
.state-view .cta:active { opacity: .8; }
</style>
</head>
<body>
<header>
  <div class="nav-row">
    <details class="nav-menu brand-menu" id="brand-menu">
      <summary>My Tesla<svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="menu">
        <a href="/tesla/charging">充电记录</a>
        <a href="/tesla/stats">充电统计</a>
        <a href="/tesla/chargemap">充电地图</a>
        <a href="/tesla/map">足迹地图</a>
        <a href="/tesla/trips">行程列表</a>
        <a href="/tesla/groups">行程分组</a>
        <a class="on" href="/tesla/live">当前驾驶</a>
        <a href="/tesla/settings">软件设置</a>
        <a href="/tesla/changelog">更新日志</a>
        <button class="logout-row" id="logout" title="退出登录">退出登录</button>
      </div>
    </details>
    <button id="refresh-btn" aria-label="刷新状态"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M12 7a5 5 0 1 1-1.46-3.54" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 1.6v2.4H9.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</header>

<main>
  <div class="booting" id="booting">
    <div class="spin"></div>
    <div>正在获取车辆状态…</div>
  </div>

  <!-- 驾驶中 -->
  <section id="live" hidden>
    <div class="hero">
      <div class="hero-speed">
        <div class="lb">当前车速</div>
        <div class="num"><span id="lv-speed">–</span><small>km/h</small></div>
      </div>
      <div class="hero-side">
        <div class="lb">已行驶</div>
        <div class="elapsed" id="lv-elapsed">–</div>
        <div class="sub" id="lv-sub">–</div>
      </div>
    </div>
    <div class="batt-card">
      <span class="batt"><i id="batt-fill" style="width:0%"></i></span>
      <b id="lv-soc">–%</b>
      <span class="batt-range">额定续航 <b id="lv-range">–</b> km</span>
    </div>
    <div class="tiles">
      <div class="tile"><div class="lb">里程</div><div class="val" id="lv-km">–</div></div>
      <div class="tile"><div class="lb">已耗电</div><div class="val" id="lv-kwh">–</div></div>
      <div class="tile"><div class="lb">平均电耗</div><div class="val" id="lv-avg">–</div></div>
      <div class="tile"><div class="lb">最高车速</div><div class="val" id="lv-vmax">–</div></div>
    </div>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="stale-hint" id="stale-hint" hidden></div>
      <div class="map-fallback" id="map-fallback" hidden>
        <div>🗺️</div>
        <div id="map-fallback-text">地图暂不可用 (未配置高德 Key 或加载失败),<br>速度与电量数据不受影响</div>
      </div>
    </div>
  </section>

  <!-- 刚结束 (上一次状态还在开车, 现在结束了) -->
  <section id="ended" hidden>
    <div class="state-view">
      <div class="big">✅</div>
      <h2>本次驾驶已结束</h2>
      <p>行程已记录, 继续出发时这里会自动恢复实时显示</p>
      <a class="cta" id="ended-link" href="/tesla/trips">查看本次行程</a>
    </div>
  </section>

  <!-- 没在开车 -->
  <section id="idle" hidden>
    <div class="state-view">
      <div class="big">🚗</div>
      <h2>当前没有进行中的驾驶</h2>
      <p>车辆出发后, 这里会实时显示车速、位置轨迹、电耗与剩余电量</p>
    </div>
  </section>
</main>

<script src="/tesla/static/gcj02.js?v=1"></script>
<script src="/tesla/static/trackutil.js?v=8"></script>
<script src="/tesla/static/live.js?v=1"></script>
</body>
</html>
